<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADK 研究文档</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #f6f8fa;
            color: #24292e;
            line-height: 1.6;
        }
        .topbar {
            background: #24292e;
            color: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar a {
            color: #79b8ff;
            text-decoration: none;
            font-size: 14px;
        }
        .topbar a:hover { text-decoration: underline; }
        .topbar .title {
            font-weight: 600;
            font-size: 15px;
            color: #fff;
        }
        .topbar .file-label {
            font-size: 13px;
            color: #959da5;
            font-family: "SFMono-Regular", Consolas, monospace;
        }
        .container {
            width: 94%;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0;
        }
        .markdown-body {
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 32px;
            min-height: 400px;
        }
        .markdown-body h1 { font-size: 2em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin: 24px 0 16px; }
        .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin: 24px 0 16px; }
        .markdown-body h3 { font-size: 1.25em; margin: 24px 0 16px; }
        .markdown-body h4 { font-size: 1em; margin: 24px 0 16px; }
        .markdown-body p { margin: 0 0 16px; }
        .markdown-body ul, .markdown-body ol { margin: 0 0 16px; padding-left: 2em; }
        .markdown-body li { margin: 4px 0; }
        .markdown-body code {
            background: rgba(27,31,35,0.05);
            border-radius: 3px;
            padding: 0.2em 0.4em;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 85%;
        }
        .markdown-body pre {
            background: #f6f8fa;
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
            margin: 0 0 16px;
        }
        .markdown-body pre code {
            background: none;
            padding: 0;
            font-size: 85%;
        }
        .markdown-body blockquote {
            border-left: 4px solid #dfe2e5;
            color: #6a737d;
            padding: 0 1em;
            margin: 0 0 16px;
        }
        .markdown-body table {
            border-collapse: collapse;
            margin: 0 0 16px;
            width: 100%;
            overflow: auto;
            display: block;
        }
        .markdown-body table th, .markdown-body table td {
            border: 1px solid #dfe2e5;
            padding: 6px 13px;
        }
        .markdown-body table tr { background: #fff; border-top: 1px solid #c6cbd1; }
        .markdown-body table tr:nth-child(2n) { background: #f6f8fa; }
        .markdown-body a { color: #0366d6; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body hr { border: 0; border-top: 1px solid #eaecef; margin: 24px 0; }
        .markdown-body img { max-width: 100%; }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6a737d;
            font-size: 16px;
        }
        .error {
            background: #ffeef0;
            border: 1px solid #f97583;
            border-radius: 6px;
            padding: 20px;
            color: #b31d28;
            margin: 20px 0;
        }
        .nav-links {
            display: flex;
            gap: 12px;
            margin-left: auto;
        }
        @media (max-width: 1024px) {
            .container { width: 96%; }
            .markdown-body { padding: 24px; }
        }
        @media (max-width: 640px) {
            .container { width: 98%; margin: 10px auto; }
            .markdown-body { padding: 16px; }
            .topbar { padding: 10px 12px; }
            .nav-links { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="https://DF4D3110.github.io/adk-research/index.html">&larr; 文档列表</a>
        <span class="title">ADK 10.0.17704.1000 研究文档</span>
        <span class="file-label" id="fileLabel"></span>
        <div class="nav-links">
            <a href="#" id="rawLink" target="_blank">查看原文</a>
        </div>
    </div>
    <div class="container">
        <div class="markdown-body" id="content">
            <div class="loading">加载中...</div>
        </div>
    </div>
    <script>
        // GitHub Pages 基础 URL（所有 md 文件从这里加载）
        const BASE_URL = 'https://DF4D3110.github.io/adk-research/';

        // 解析 URL 参数
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file') || '00_INDEX_MASTER.md';
        const fileUrl = BASE_URL + file;

        document.getElementById('fileLabel').textContent = file;
        document.getElementById('rawLink').href = fileUrl;

        // 配置 marked
        marked.setOptions({
            breaks: false,
            gfm: true,
            headerIds: true
        });

        // 从 GitHub 加载并渲染 md
        fetch(fileUrl)
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
                return r.text();
            })
            .then(text => {
                const html = marked.parse(text);
                document.getElementById('content').innerHTML = html;
                document.title = file + ' - ADK 研究文档';
            })
            .catch(err => {
                document.getElementById('content').innerHTML =
                    '<div class="error"><strong>加载失败</strong><br>' + err.message +
                    '<br><br>请确认文件已推送到 GitHub，或返回<a href="https://DF4D3110.github.io/adk-research/index.html">文档列表</a>。</div>';
            });
    </script>
</body>
</html>
